services:
  - type: web
    name: hazina-asili
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      # ----- Render injects PORT automatically -----
      - key: PORT
        value: "10000"

      # ----- Application -----
      - key: APP_NAME
        value: "HAZINA ASILI"
      - key: APP_FULL_NAME
        value: "Natural Organic Compounds Database"
      - key: APP_VERSION
        value: "3.0.0"
      - key: APP_URL
        value: "https://hazina-asili.onrender.com/"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "true"
      - key: FORCE_HTTPS
        value: "true"

      # ----- Database (TiDB Serverless) -----
      # Fill these from TiDB Cloud console → Connect → PHP/MySQL tab
      - key: DB_HOST
        value: "gateway01.eu-central-1.prod.aws.tidbcloud.com"
      - key: DB_PORT
        value: "4000"
      - key: DB_USER
        value: "24cavmxfc9wVuEi.root"
      - key: DB_PASS
        value: "kKqB7nx3pDMSrSX7"
      - key: DB_NAME
        value: "hazina_asili"
      - key: DB_CHARSET
        value: "utf8mb4"
      - key: DB_SSL
        value: "true"  # TiDB requires SSL

      # ----- Session -----
      - key: SESSION_LIFETIME
        value: "3600"
      - key: RECORDS_PER_PAGE
        value: "15"

      # ----- Security -----
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCKOUT_MINUTES
        value: "15"
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_PASSWORD
        value: "faith@mabiki"

      # ----- AI Assistant (optional — uses Groq free tier) -----
      - key: AI_ENABLED
        value: "true"
      - key: AI_API_KEY
        sync: false   # Get free key at console.groq.com
      - key: AI_API_URL
        value: "https://api.groq.com/openai/v1/chat/completions"
      - key: AI_MODEL
        value: "llama-3.3-70b-versatile"

      # ----- Email (optional) -----
      - key: MAIL_ENABLED
        value: "false"
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: "tls"
      - key: MAIL_FROM_ADDRESS
        value: "noreply@hazina-asili.com"
      - key: MAIL_FROM_NAME
        value: "HAZINA ASILI"

      # ----- OAuth (optional) -----
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
